# Релизный workflow: SemVer tags, выбранные PR activity types и ручной запуск.
name: Release pipeline

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*-beta*'
  pull_request:
    types:
      - opened
      - synchronize
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release event
    runs-on: ubuntu-latest
    steps:
      - name: Show event context
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Ref: $GIT_REF"
          echo "Pull request merged: $PR_MERGED"

  deploy:
    name: Deploy release or merged pull request
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      (github.ref_type == 'tag' &&
       startsWith(github.ref, 'refs/tags/v') &&
       !contains(github.ref, '-beta')) ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true)
    steps:
      - name: Checkout deployable source
        uses: actions/checkout@v4
      - name: Deployment placeholder
        run: echo "Deployment condition passed for a version tag or merged pull request."
